[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rav"
version = "0.1.0"
description = "Reasoning-Aware Vision foundation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "RAV contributors" }]
dependencies = [
    "pydantic>=2.8,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
vlm = [
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "pillow>=10,<12",
    "transformers>=4.52,<4.53",
    "accelerate>=1.6,<1.7",
    "tqdm>=4.66,<5",
    "peft>=0.15,<0.16",
    "bitsandbytes>=0.47,<0.48",
]
mobile-camera = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0.12,<7",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["rav", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rav"]

[tool.hatch.build.targets.wheel]
packages = ["rav"]
